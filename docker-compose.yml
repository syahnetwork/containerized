services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-devsecops-app:1.0.0 # Pin explicit version, never use :latest
    container_name: devsecops-app
    user: "65532:65532" # Run as non-root (matches distroless nonroot)
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=10m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080" # Bind to localhost only, not 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped