name: DevSecOps Pipeline 2026

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-scan-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build image locally (Do NOT push yet)
      - name: Build Docker image (Load to daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: my-devsecops-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Scan the local image with Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.31.0 # Pinned version to prevent supply chain attacks
        with:
          image-ref: my-devsecops-app:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1' # Fail the job if vulnerabilities are found

      # 3. Upload results to GitHub Security tab (Runs even if scan fails)
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # 4. Push to Registry ONLY if the scan passed
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/my-devsecops-app:latest